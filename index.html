    <title>tabela de alunos</title>
    <style>
        table {
            width: 55% ;
            border-collapse: collapse;
            margin: 30px auto;
        }
        h1{
            text-align: center;
            font-size: 36px;
        }
        th, td {
            text-align: center;
            padding: 20px;
            border: 1px solid black;
        }
        th {
            background-color:#2E435A;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #dfe6ed;
        }
        td:hover {
            background-color: gray;
        }
    </style>

</head>
